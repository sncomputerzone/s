<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SN Internet Zone - Registration</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ff9933,#ffffff,#138808);
}

.box{
    width:90%;
    max-width:400px;
    background:white;
    padding:30px 25px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    text-align:center;
}

.logo{
    width:80px;
    height:80px;
    margin:0 auto 15px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0d47a1;
    color:white;
    font-size:27px;
    font-weight:bold;
    border:5px solid white;
    box-shadow:
        0 0 0 4px #ff9933,
        0 0 0 8px #138808;
}

h1{
    margin:5px 0;
    color:#0d47a1;
    font-size:24px;
}

.subtitle{
    color:#666;
    font-size:14px;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:13px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#0d47a1;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:9px;
    background:#0d47a1;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

#message{
    margin-top:15px;
    font-size:14px;
    min-height:20px;
}

#pinBox{
    display:none;
    margin-top:20px;
    padding:18px;
    border-radius:12px;
    background:#f1f7ff;
    border:2px solid #0d47a1;
}

.pin-title{
    font-size:15px;
    color:#555;
}

.pin{
    margin-top:8px;
    font-size:30px;
    font-weight:bold;
    letter-spacing:6px;
    color:#d84315;
}

.note{
    margin-top:10px;
    font-size:12px;
    color:#555;
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">SN</div>

    <h1>SN INTERNET ZONE</h1>

    <div class="subtitle">
        User Registration
    </div>

    <input
        type="text"
        id="name"
        placeholder="Enter your name"
        autocomplete="name"
    >

    <input
        type="tel"
        id="mobile"
        placeholder="10-digit mobile number"
        maxlength="10"
        inputmode="numeric"
        autocomplete="tel"
    >

    <button id="registerBtn">
        REGISTER
    </button>

    <div id="message"></div>

    <div id="pinBox">

        <div class="pin-title">
            Your 4-Digit PIN
        </div>

        <div class="pin" id="pin"></div>

        <div class="note">
            Keep this PIN safe. It is attached to your mobile number.
        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://ikotfwggtwbmnepgvchu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_QtHH2tYYHFrlvELjhPWMaA_-DesTdzk";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const nameInput =
    document.getElementById("name");

const mobileInput =
    document.getElementById("mobile");

const registerBtn =
    document.getElementById("registerBtn");

const message =
    document.getElementById("message");

const pinBox =
    document.getElementById("pinBox");

const pinDisplay =
    document.getElementById("pin");


/* Only numbers in mobile */

mobileInput.addEventListener("input", function(){

    this.value =
        this.value.replace(/\D/g,"").slice(0,10);

});


/* Registration */

registerBtn.addEventListener("click", async function(){

    const name =
        nameInput.value.trim();

    const mobile =
        mobileInput.value.trim();


    pinBox.style.display = "none";


    if(!name){

        message.style.color = "red";
        message.textContent =
            "Please enter your name.";

        return;
    }


    if(!/^\d{10}$/.test(mobile)){

        message.style.color = "red";
        message.textContent =
            "Please enter a valid 10-digit mobile number.";

        return;
    }


    registerBtn.disabled = true;
    registerBtn.textContent = "REGISTERING...";

    message.style.color = "#0d47a1";
    message.textContent =
        "Creating your account...";


    try{

        const { data, error } =
            await supabaseClient.rpc(
                "register_user",
                {
                    p_name: name,
                    p_mobile: mobile
                }
            );


        if(error){
            throw error;
        }


        if(!data || data.length === 0){

            throw new Error(
                "Registration failed."
            );
        }


        const user =
            data[0];


        message.style.color = "green";

        message.textContent =
            "Registration successful.";


        pinDisplay.textContent =
            user.pin;

        pinBox.style.display =
            "block";


    }catch(error){

        console.error(error);

        message.style.color = "red";

        message.textContent =
            error.message ||
            "Registration failed.";

    }


    registerBtn.disabled = false;
    registerBtn.textContent = "REGISTER";

});

</script>

</body>
</html>
