<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SN Internet Zone</title>

<style>

/* =========================
   BASIC
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    min-height:100%;
}

body{
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;
    color:#102030;
    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 20% 15%,
            rgba(255,255,255,.95),
            transparent 25%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(255,255,255,.7),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #d8e3ea,
            #ffffff,
            #cbd7df
        );

    position:relative;
}


/* =========================
   MAIN CONTAINER
   PAGE LIGHTNING REMOVED
========================= */

.container{

    width:94%;
    max-width:1100px;

    margin:20px auto;
    padding:20px;

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.55),
            rgba(255,255,255,.22)
        );

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.85);

    box-shadow:

        0 20px 50px rgba(0,0,0,.18),

        inset
        0 1px 2px
        rgba(255,255,255,.95),

        inset
        0 -1px 2px
        rgba(0,0,0,.08);

    position:relative;

    overflow:hidden;
}


/* =========================
   HEADER
========================= */

.header{

    display:flex;
    align-items:center;

    gap:18px;

    padding:
        8px
        5px
        20px;
}


/* =========================
   LOGO
========================= */

.logo-box{

    width:78px;
    height:78px;

    min-width:78px;

    border-radius:50%;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #d5dfe6
        );

    border:
        3px solid
        rgba(255,255,255,.9);

    box-shadow:

        0 8px 20px
        rgba(0,0,0,.20),

        inset
        5px 5px 12px
        rgba(255,255,255,.9),

        inset
        -5px -5px 12px
        rgba(0,0,0,.12);

    display:flex;

    justify-content:center;
    align-items:center;

    overflow:hidden;

    position:relative;
}


/*
अपना LOGO लगाने के लिए:

<div class="logo-placeholder">SN</div>

को हटाकर:

<img
    src="images/logo.png"
    alt="SN Internet Zone Logo"
>
*/

.logo-box img{

    width:100%;
    height:100%;

    object-fit:cover;
}


.logo-placeholder{

    font-size:25px;
    font-weight:bold;

    color:#0759a5;

    text-shadow:
        0 2px 4px
        rgba(0,0,0,.2);
}


/* =========================
   TITLE
   TRICOLOR SHINING
========================= */

.title-area h1{

    font-size:
        clamp(
            25px,
            5vw,
            42px
        );

    letter-spacing:2px;

    background:

        linear-gradient(
            90deg,

            #ff9933 0%,
            #ff9933 30%,

            #ffffff 42%,
            #ffffff 58%,

            #138808 70%,
            #138808 100%
        );

    background-size:300% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        tricolorShine
        4s linear infinite;

    filter:
        drop-shadow(
            0 3px 3px
            rgba(0,0,0,.20)
        );
}


@keyframes tricolorShine{

    0%{
        background-position:
            0% center;
    }

    50%{
        background-position:
            150% center;
    }

    100%{
        background-position:
            300% center;
    }

}


.title-area p{

    margin-top:5px;

    font-size:14px;

    color:#455a64;

    letter-spacing:1px;
}


/* =========================
   SLIDER
========================= */

.slider{

    width:100%;
    height:300px;

    position:relative;

    overflow:hidden;

    border-radius:24px;

    border:
        2px solid
        rgba(255,255,255,.8);

    box-shadow:

        0 15px 35px
        rgba(0,0,0,.22),

        inset
        0 2px 5px
        rgba(255,255,255,.8);

    background:#dfe7ec;
}


.slide{

    position:absolute;

    inset:0;

    opacity:0;

    transition:
        opacity 1s ease;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;
}


.slide.active{

    opacity:1;
}


.slide img{

    width:100%;
    height:100%;

    object-fit:cover;
}


/* =========================
   SLIDER PLACEHOLDER
========================= */

.slide-placeholder{

    width:100%;
    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:45px;
    font-weight:bold;

    color:white;

    background:

        linear-gradient(
            135deg,

            #ff9933,
            #ffffff,
            #138808,
            #0d47a1
        );

    background-size:300% 300%;

    animation:
        sliderBackground
        8s ease infinite;
}


@keyframes sliderBackground{

    0%{
        background-position:
            0% 50%;
    }

    50%{
        background-position:
            100% 50%;
    }

    100%{
        background-position:
            0% 50%;
    }

}


/* =========================
   SLIDER LIGHT
========================= */

.slider::after{

    content:"";

    position:absolute;

    top:0;

    left:-100%;

    width:45%;

    height:100%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.30),
            transparent
        );

    transform:
        skewX(-20deg);

    animation:
        sliderShine
        6s infinite;
}


@keyframes sliderShine{

    0%{
        left:-100%;
    }

    55%,
    100%{
        left:150%;
    }

}


/* =========================
   DOTS
========================= */

.dots{

    position:absolute;

    bottom:12px;
    left:50%;

    transform:
        translateX(-50%);

    display:flex;

    gap:8px;

    z-index:3;
}


.dot{

    width:9px;
    height:9px;

    border-radius:50%;

    background:
        rgba(255,255,255,.55);

    box-shadow:
        0 2px 5px
        rgba(0,0,0,.3);

    transition:.3s;
}


.dot.active{

    width:24px;

    border-radius:10px;

    background:white;
}


/* =========================
   LOGIN CARD
========================= */

.login-card{

    margin-top:25px;

    padding:25px;

    border-radius:25px;

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.75),
            rgba(255,255,255,.25)
        );

    border:
        1px solid
        rgba(255,255,255,.9);

    box-shadow:

        0 15px 35px
        rgba(0,0,0,.15),

        inset
        0 2px 5px
        rgba(255,255,255,.9);

    position:relative;

    overflow:hidden;
}


.login-title{

    text-align:center;

    font-size:23px;

    font-weight:bold;

    color:#064f91;

    margin-bottom:18px;
}


/* =========================
   FORM
========================= */

.form-row{

    display:flex;

    gap:12px;

    align-items:end;
}


.input-group{

    flex:1;
}


.input-group label{

    display:block;

    font-size:12px;

    font-weight:bold;

    margin-bottom:6px;

    color:#43515b;
}


.input-group input{

    width:100%;

    height:52px;

    border:none;

    outline:none;

    border-radius:15px;

    padding:
        0 16px;

    font-size:16px;

    background:
        rgba(255,255,255,.75);

    box-shadow:

        inset
        3px 3px 8px
        rgba(0,0,0,.10),

        inset
        -3px -3px 8px
        rgba(255,255,255,.9);

    border:
        1px solid
        rgba(255,255,255,.8);
}


.input-group input:focus{

    box-shadow:

        0 0 0 3px
        rgba(33,150,243,.18),

        inset
        2px 2px 6px
        rgba(0,0,0,.08);
}


/* =========================
   OPEN BUTTON
========================= */

.open-btn{

    height:52px;

    padding:
        0 20px;

    border:none;

    border-radius:14px;

    background:

        linear-gradient(
            145deg,
            #0d6efd,
            #064f9c
        );

    color:white;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:

        0 6px 15px
        rgba(0,0,0,.22),

        inset
        0 1px 2px
        rgba(255,255,255,.45);

    transition:.2s;
}


.open-btn:hover{

    transform:
        translateY(-2px);

    box-shadow:

        0 9px 20px
        rgba(0,0,0,.25);
}


.open-btn:active{

    transform:
        scale(.96);
}


/* =========================
   FOOTER
========================= */

.footer{

    text-align:center;

    margin-top:20px;

    font-size:12px;

    color:#60717c;
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    .container{

        width:96%;

        padding:13px;

        margin:10px auto;

        border-radius:22px;
    }


    .header{

        gap:12px;

        padding-bottom:14px;
    }


    .logo-box{

        width:62px;
        height:62px;

        min-width:62px;
    }


    .logo-placeholder{

        font-size:20px;
    }


    .title-area h1{

        font-size:22px;

        letter-spacing:1px;
    }


    .title-area p{

        font-size:11px;
    }


    .slider{

        height:190px;

        border-radius:18px;
    }


    .slide-placeholder{

        font-size:30px;
    }


    .login-card{

        padding:18px;

        border-radius:20px;
    }


    .form-row{

        gap:7px;
    }


    .input-group input{

        height:48px;

        padding:
            0 10px;

        font-size:14px;
    }


    .open-btn{

        height:48px;

        padding:
            0 12px;

        font-size:11px;
    }


    .input-group label{

        font-size:10px;
    }

}

</style>
</head>


<body>


<div class="container">


    <!-- =========================
         HEADER
    ========================== -->

    <div class="header">


        <!-- LOGO -->

        <div class="logo-box">

            <!--
            बाद में अपना Logo लगाने के लिए:

            <img
                src="images/logo.png"
                alt="SN Internet Zone Logo"
            >
            -->

            <div class="logo-placeholder">
                SN
            </div>

        </div>


        <!-- TITLE -->

        <div class="title-area">

            <h1>
                SN INTERNET ZONE
            </h1>

            <p>
                Welcome to SN Internet Zone
            </p>

        </div>

    </div>


    <!-- =========================
         SLIDER
    ========================== -->

    <div class="slider">


        <!-- SLIDE 1 -->

        <div class="slide active">

            <!--
            बाद में:

            <img
                src="images/slide1.jpg"
                alt="Slide 1"
            >
            -->

            <div class="slide-placeholder">
                SLIDE 1
            </div>

        </div>


        <!-- SLIDE 2 -->

        <div class="slide">

            <!--
            <img
                src="images/slide2.jpg"
                alt="Slide 2"
            >
            -->

            <div class="slide-placeholder">
                SLIDE 2
            </div>

        </div>


        <!-- SLIDE 3 -->

        <div class="slide">

            <!--
            <img
                src="images/slide3.jpg"
                alt="Slide 3"
            >
            -->

            <div class="slide-placeholder">
                SLIDE 3
            </div>

        </div>


        <!-- SLIDE 4 -->

        <div class="slide">

            <!--
            <img
                src="images/slide4.jpg"
                alt="Slide 4"
            >
            -->

            <div class="slide-placeholder">
                SLIDE 4
            </div>

        </div>


        <!-- SLIDE 5 -->

        <div class="slide">

            <!--
            <img
                src="images/slide5.jpg"
                alt="Slide 5"
            >
            -->

            <div class="slide-placeholder">
                SLIDE 5
            </div>

        </div>


        <!-- DOTS -->

        <div class="dots">

            <div class="dot active"></div>

            <div class="dot"></div>

            <div class="dot"></div>

            <div class="dot"></div>

            <div class="dot"></div>

        </div>


    </div>


    <!-- =========================
         LOGIN
    ========================== -->

    <div class="login-card">


        <div class="login-title">
            User Login
        </div>


        <div class="form-row">


            <!-- MOBILE -->

            <div class="input-group">

                <label>
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    maxlength="10"
                    inputmode="numeric"
                    autocomplete="tel"
                    placeholder="10 Digit Mobile"
                    oninput="
                        this.value=
                        this.value
                        .replace(/[^0-9]/g,'')
                        .slice(0,10)
                    "
                >

            </div>


            <!-- PIN -->

            <div class="input-group">

                <label>
                    PIN
                </label>

                <input
                    type="password"
                    id="pin"
                    maxlength="4"
                    inputmode="numeric"
                    autocomplete="off"
                    placeholder="4 Digit PIN"
                    oninput="
                        this.value=
                        this.value
                        .replace(/[^0-9]/g,'')
                        .slice(0,4)
                    "
                >

            </div>


            <!-- OPEN -->

            <button
                type="button"
                class="open-btn"
                onclick="openPage()"
            >
                OPEN
            </button>


        </div>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        © SN Internet Zone

    </div>


</div>


<script>


/* =========================
   SLIDER
========================= */

let currentSlide = 0;

const slides =
    document.querySelectorAll(".slide");

const dots =
    document.querySelectorAll(".dot");


function showSlide(index){

    slides.forEach(
        slide =>
        slide.classList.remove("active")
    );

    dots.forEach(
        dot =>
        dot.classList.remove("active")
    );

    slides[index]
        .classList.add("active");

    dots[index]
        .classList.add("active");

}


setInterval(() => {

    currentSlide++;

    if(
        currentSlide >=
        slides.length
    ){

        currentSlide = 0;

    }

    showSlide(currentSlide);

},5000);


/* =========================
   OPEN BUTTON
========================= */

function openPage(){

    const mobile =
        document.getElementById("mobile")
        .value;

    const pin =
        document.getElementById("pin")
        .value;


    if(mobile.length !== 10){

        alert(
            "Please enter a valid 10 digit mobile number."
        );

        return;

    }


    if(pin.length !== 4){

        alert(
            "Please enter your 4 digit PIN."
        );

        return;

    }


    window.location.href =
        "home.html";

}


</script>


</body>
</html>
