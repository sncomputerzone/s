<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SN INTERNET ZONE</title>

<style>

/* =========================
   BASIC PAGE
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #222;
}


/* =========================
   MAIN CONTAINER
========================= */

.container {
    width: 100%;
    max-width: 520px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 20px;
    padding: 20px;
}


/* =========================
   LOGO AREA
========================= */

.logo-area {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 18px;
}


/* Tricolor rotating outer circle */

.logo-border {
    width: 82px;
    height: 82px;
    border-radius: 50%;
    padding: 4px;

    background: conic-gradient(
        #ff9933,
        white,
        #138808,
        #ff9933
    );

    animation: rotateTricolor 3s linear infinite;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* Logo itself */

.logo {
    width: 74px;
    height: 74px;
    border-radius: 50%;

    background: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;
    font-weight: bold;

    color: #0d47a1;

    overflow: hidden;
}


/*
   बाद में अपना Logo लगाना हो तो
   .logo के अंदर यह लगाएं:

   <img src="images/logo.png">

   और CSS:
   .logo img {
       width: 100%;
       height: 100%;
       object-fit: cover;
   }
*/

@keyframes rotateTricolor {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


/* =========================
   TITLE
========================= */

.title {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 1px;

    background: linear-gradient(
        90deg,
        #ff9933 0%,
        #ff9933 32%,
        #222 32%,
        #222 52%,
        #138808 52%,
        #138808 84%,
        #ff9933 84%,
        #ff9933 100%
    );

    background-size: 200% auto;

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    animation: tricolorMove 3s linear infinite;
}

@keyframes tricolorMove {
    0% {
        background-position: 200% center;
    }

    100% {
        background-position: -200% center;
    }
}

.subtitle {
    text-align: center;
    margin-top: 6px;
    margin-bottom: 18px;
    font-size: 14px;
    color: #666;
}


/* =========================
   SLIDER
========================= */

.slider {
    position: relative;
    width: 100%;
    height: 220px;

    overflow: hidden;

    border-radius: 15px;
    border: 1px solid #ccc;

    background: #ddd;

    margin-bottom: 20px;
}


/* Slides */

.slides {
    display: flex;
    width: 500%;
    height: 100%;

    animation: slideMove 15s infinite;
}

.slide {
    width: 20%;
    height: 100%;
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}


/* Placeholder colors */

.slide:nth-child(1) {
    background: #e8f1ff;
}

.slide:nth-child(2) {
    background: #fff0e5;
}

.slide:nth-child(3) {
    background: #e8f7e8;
}

.slide:nth-child(4) {
    background: #fff9d9;
}

.slide:nth-child(5) {
    background: #eee8ff;
}


/* Slider text */

.slide-text {
    font-size: 32px;
    font-weight: bold;
    color: #444;

    z-index: 2;
}


/* =========================
   WATER DROPS
========================= */

.drop {
    position: absolute;

    top: -50px;

    width: 14px;
    height: 22px;

    border-radius: 50% 50% 55% 55%;

    background: rgba(255, 255, 255, 0.45);

    border: 1px solid rgba(255,255,255,0.75);

    box-shadow:
        inset 3px 3px 5px rgba(255,255,255,0.8),
        inset -2px -2px 5px rgba(0,0,0,0.08);

    backdrop-filter: blur(1px);

    z-index: 5;

    animation: waterSlide linear infinite;
}


/* Different drops */

.drop1 {
    left: 12%;
    animation-duration: 6s;
    animation-delay: 0s;
}

.drop2 {
    left: 27%;
    width: 9px;
    height: 16px;
    animation-duration: 7s;
    animation-delay: 1s;
}

.drop3 {
    left: 43%;
    width: 17px;
    height: 25px;
    animation-duration: 8s;
    animation-delay: 2s;
}

.drop4 {
    left: 61%;
    width: 11px;
    height: 18px;
    animation-duration: 6.5s;
    animation-delay: 1.5s;
}

.drop5 {
    left: 78%;
    width: 15px;
    height: 23px;
    animation-duration: 7.5s;
    animation-delay: 3s;
}

.drop6 {
    left: 90%;
    width: 8px;
    height: 14px;
    animation-duration: 5.5s;
    animation-delay: 2s;
}


/* Water drop slowly moving downward */

@keyframes waterSlide {

    0% {
        top: -50px;
        transform: translateX(0) scale(0.8);
        opacity: 0;
    }

    10% {
        opacity: 0.8;
    }

    30% {
        transform: translateX(4px) scale(1);
    }

    50% {
        transform: translateX(-3px) scale(1.05);
    }

    70% {
        transform: translateX(3px) scale(0.95);
    }

    90% {
        opacity: 0.6;
    }

    100% {
        top: 240px;
        transform: translateX(-2px) scale(0.9);
        opacity: 0;
    }
}


/* =========================
   SLIDE ANIMATION
========================= */

@keyframes slideMove {

    0% {
        transform: translateX(0);
    }

    17% {
        transform: translateX(0);
    }

    20% {
        transform: translateX(-20%);
    }

    37% {
        transform: translateX(-20%);
    }

    40% {
        transform: translateX(-40%);
    }

    57% {
        transform: translateX(-40%);
    }

    60% {
        transform: translateX(-60%);
    }

    77% {
        transform: translateX(-60%);
    }

    80% {
        transform: translateX(-80%);
    }

    97% {
        transform: translateX(-80%);
    }

    100% {
        transform: translateX(0);
    }
}


/* =========================
   LOGIN BOX
========================= */

.login-box {
    width: 100%;
    background: #ffffff;

    border: 1px solid #ddd;
    border-radius: 15px;

    padding: 20px;
}


.input-group {
    margin-bottom: 15px;
}


.input-group label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 7px;
}


.input-group input {
    width: 100%;

    height: 48px;

    border: 1px solid #ccc;
    border-radius: 10px;

    padding: 0 14px;

    font-size: 16px;

    outline: none;
}


.input-group input:focus {
    border-color: #0d47a1;
}


/* =========================
   OPEN BUTTON
========================= */

.open-btn {
    width: 100%;

    height: 48px;

    border: none;
    border-radius: 10px;

    background: #0d47a1;
    color: white;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;

    margin-top: 5px;
}

.open-btn:hover {
    background: #083477;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    body {
        padding: 12px;
    }

    .container {
        padding: 15px;
    }

    .logo-border {
        width: 70px;
        height: 70px;
    }

    .logo {
        width: 62px;
        height: 62px;
        font-size: 21px;
    }

    .title {
        font-size: 21px;
    }

    .slider {
        height: 180px;
    }

    .slide-text {
        font-size: 25px;
    }
}

</style>
</head>


<body>

<div class="container">


    <!-- =====================
         LOGO + TITLE
    ====================== -->

    <div class="logo-area">

        <div class="logo-border">

            <div class="logo">
                SN
            </div>

        </div>


        <div>
            <div class="title">
                SN INTERNET ZONE
            </div>

            <div class="subtitle">
                Welcome to SN Internet Zone
            </div>
        </div>

    </div>


    <!-- =====================
         SLIDER
    ====================== -->

    <div class="slider">

        <div class="slides">


            <!-- SLIDE 1 -->

            <div class="slide">

                <div class="slide-text">
                    SLIDE 1
                </div>

                <span class="drop drop1"></span>
                <span class="drop drop2"></span>
                <span class="drop drop3"></span>
                <span class="drop drop4"></span>
                <span class="drop drop5"></span>
                <span class="drop drop6"></span>

            </div>


            <!-- SLIDE 2 -->

            <div class="slide">

                <div class="slide-text">
                    SLIDE 2
                </div>

                <span class="drop drop1"></span>
                <span class="drop drop2"></span>
                <span class="drop drop3"></span>
                <span class="drop drop4"></span>
                <span class="drop drop5"></span>
                <span class="drop drop6"></span>

            </div>


            <!-- SLIDE 3 -->

            <div class="slide">

                <div class="slide-text">
                    SLIDE 3
                </div>

                <span class="drop drop1"></span>
                <span class="drop drop2"></span>
                <span class="drop drop3"></span>
                <span class="drop drop4"></span>
                <span class="drop drop5"></span>
                <span class="drop drop6"></span>

            </div>


            <!-- SLIDE 4 -->

            <div class="slide">

                <div class="slide-text">
                    SLIDE 4
                </div>

                <span class="drop drop1"></span>
                <span class="drop drop2"></span>
                <span class="drop drop3"></span>
                <span class="drop drop4"></span>
                <span class="drop drop5"></span>
                <span class="drop drop6"></span>

            </div>


            <!-- SLIDE 5 -->

            <div class="slide">

                <div class="slide-text">
                    SLIDE 5
                </div>

                <span class="drop drop1"></span>
                <span class="drop drop2"></span>
                <span class="drop drop3"></span>
                <span class="drop drop4"></span>
                <span class="drop drop5"></span>
                <span class="drop drop6"></span>

            </div>

        </div>

    </div>


    <!-- =====================
         LOGIN
    ====================== -->

    <div class="login-box">

        <div class="input-group">

            <label>
                Mobile Number
            </label>

            <input
                type="tel"
                id="mobile"
                placeholder="Enter 10 digit mobile number"
                maxlength="10"
                inputmode="numeric"
            >

        </div>


        <div class="input-group">

            <label>
                PIN
            </label>

            <input
                type="password"
                id="pin"
                placeholder="Enter 4 digit PIN"
                maxlength="4"
                inputmode="numeric"
            >

        </div>


        <button
            class="open-btn"
            onclick="openNextPage()"
        >
            OPEN
        </button>

    </div>

</div>


<script>

/* =========================
   ONLY NUMBERS
========================= */

document.getElementById("mobile").addEventListener("input", function () {

    this.value = this.value.replace(/\D/g, "");

});


document.getElementById("pin").addEventListener("input", function () {

    this.value = this.value.replace(/\D/g, "");

});


/* =========================
   OPEN NEXT PAGE
========================= */

function openNextPage() {

    const mobile = document.getElementById("mobile").value;
    const pin = document.getElementById("pin").value;


    if (mobile.length !== 10) {

        alert("Please enter a valid 10 digit mobile number.");

        return;
    }


    if (pin.length !== 4) {

        alert("Please enter a valid 4 digit PIN.");

        return;
    }


    /* Next page */

    window.location.href = "home.html";

}

</script>

</body>
</html>
